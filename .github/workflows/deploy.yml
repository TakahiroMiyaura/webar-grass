# Publishes web/ to GitHub Pages. The 8th Wall engine binary and three.js are
# fetched at build time by setup.sh, so neither is committed to the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch three.js and the 8th Wall engine binary
        run: ./setup.sh
      - name: Drop the unused face/semantics payload (~24MB)
        run: rm -rf web/external/xr/resources web/external/xr/xr-face.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
