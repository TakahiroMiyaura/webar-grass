<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>草の描画ベンチマーク</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#eee}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #panel{position:absolute;left:0;right:0;bottom:0;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    background:rgba(0,0,0,.72);font-size:13px;line-height:1.6}
  #panel b{color:#9f6}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
  button{background:#2b2b2b;color:#eee;border:1px solid #555;border-radius:6px;
    padding:7px 11px;font-size:13px}
  button.on{background:#375;border-color:#7c9}
  #result{margin-top:8px;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre;color:#cfc}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div>草 <b id="n">0</b> 株 / DPR <b id="dpr">-</b> / <span id="live">-</span></div>
  <div class="row">
    <span>株数:</span>
    <button data-n="100">100</button><button data-n="300">300</button>
    <button data-n="600">600</button><button data-n="900">900</button>
  </div>
  <div class="row">
    <span>DPR:</span>
    <button data-dpr="1">1.0</button><button data-dpr="1.5">1.5</button>
    <button data-dpr="2">2.0</button><button data-dpr="3">3.0</button>
  </div>
  <div class="row">
    <button id="shadowBtn">接地影</button>
    <button id="feedBtn">カメラ映像相当</button>
    <button id="sweepBtn">自動計測</button>
  </div>
  <div id="result">「自動計測」で 12 通りを順に測ります。実機では端末を持ったまま置いて動かさないでください。</div>
</div>
<script type="module" src="/src/bench.ts"></script>
</body>
</html>
