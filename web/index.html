<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>8th Wall self-host check — tap to place a cube</title>
  <!--
    This product includes the XR Engine software developed by Niantic Spatial, Inc.
    Copyright (c) 2026 Niantic Spatial, Inc. All rights reserved.
    License: https://github.com/8thwall/engine/blob/main/LICENSE
  -->
  <!-- Runs before the engine so an in-app webview never reaches the camera prompt. -->
  <script src="./openin.js"></script>
  <!-- Self-hosted engine binary. No CDN, no app key, no account. -->
  <script src="./external/xr/xr.js" async data-preload-chunks="slam"></script>
  <link rel="stylesheet" href="./tracking-ux.css">
  <style>
    html, body {margin:0; height:100%; overflow:hidden; background:#000;
      font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;}
    #camerafeed {position:absolute; inset:0; width:100%; height:100%;}
    /* Guidance is owned by tracking-ux.js; this line is only the placement read-out. */
    #hud {position:absolute; top:env(safe-area-inset-top, 0); left:0; padding:6px 10px;
      color:#8fa; font:11px/1.5 ui-monospace, monospace; background:rgba(0,0,0,.45);
      pointer-events:none; z-index:200;}
  </style>
</head>
<body>
  <canvas id="camerafeed"></canvas>
  <div id="hud"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
