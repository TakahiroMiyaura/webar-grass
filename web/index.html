<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- Self-hosted engine binary. No CDN, no app key, no account. -->
  <script src="./external/xr/xr.js" async data-preload-chunks="slam"></script>
  <style>
    html, body {margin:0; height:100%; overflow:hidden; background:#000;
      font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;}
    #camerafeed {position:absolute; inset:0; width:100%; height:100%;}
    #hud {position:absolute; left:0; right:0; bottom:env(safe-area-inset-bottom, 0);
      padding:12px 16px 20px; color:#fff; text-align:center; font-size:14px; line-height:1.5;
      background:linear-gradient(transparent, rgba(0,0,0,.65)); pointer-events:none;}
    #hud b {font-size:16px}
  </style>
</head>
<body>
  <canvas id="camerafeed"></canvas>
  <div id="hud"><b id="status">起動中…</b><br><span id="detail"></span></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
